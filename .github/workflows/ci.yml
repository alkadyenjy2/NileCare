name: NileCare CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: nilecare-landing
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: nilecare-landing/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=critical
      - run: npx tsc --noEmit
      - run: npm run build
      - run: node ../scripts/test-suite.mjs
      - run: node ../scripts/self-check.mjs
